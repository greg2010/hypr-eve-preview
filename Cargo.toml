[package]
name = "hypr-eve-preview"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["calloop"] }
wayland-client = "=0.31.15"
wayland-backend = "=0.3.17"
wayland-scanner = "=0.31.11"
wayland-protocols = { version = "=0.32.13", features = ["client"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
gbm = { version = "=0.18.0", default-features = false }
calloop = { version = "=0.14.4", features = ["signals"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
bitflags = "=2.13.2"
ab_glyph = "=0.2.32"
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde"] }
